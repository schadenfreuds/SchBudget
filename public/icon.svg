<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Obsidian to Deep Forest) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c1311" />
      <stop offset="100%" stop-color="#041510" />
    </linearGradient>

    <!-- Emerald Glow Radial -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ribbon Gradient A (Bright Emerald) -->
    <linearGradient id="ribbonA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Ribbon Gradient B (Deep Emerald) -->
    <linearGradient id="ribbonB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gold Accent Spark -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base (Apple/Android Collection Standard rx=116) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#emeraldGlow)" />

  <!-- Subtle Outer Rim Stroke -->
  <rect x="3" y="3" width="506" height="506" rx="114" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Central Emblem: The "S" Geometric Ribbon & Vault Growth -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Upper Hook of S / Growth Arrow Peak -->
    <path d="M 310 145 C 340 145 365 170 365 200 C 365 230 335 245 295 255 L 217 275 C 180 285 155 302 155 330 C 155 365 185 390 225 390 C 265 390 300 370 325 345"
          fill="none" stroke="url(#ribbonA)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Underpass Arc of S giving 3D Layered Flow -->
    <path d="M 202 367 C 172 367 147 342 147 312 C 147 282 177 267 217 257 L 295 237 C 332 227 357 210 357 182 C 357 147 327 122 287 122 C 247 122 212 142 187 167"
          fill="none" stroke="url(#ribbonB)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Center Growth Diagonal Core Bar -->
    <line x1="205" y1="278" x2="307" y2="234" stroke="#a7f3d0" stroke-width="26" stroke-linecap="round" />

    <!-- Gold Accent Sparkle (Wealth/Budget Symbolism) -->
    <circle cx="365" cy="145" r="14" fill="url(#goldSpark)" />
    <polygon points="365,120 371,140 391,145 371,150 365,170 359,150 339,145 359,140" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Suite Monogram Signature: "SCH" -->
  <g text-anchor="middle">
    <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="34" font-weight="900" letter-spacing="9" fill="#10b981" opacity="0.95">SCH</text>
  </g>
</svg>
